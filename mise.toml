# Tool versions and tasks. Pin every tool to an exact version.
# Add the project stack here once it is chosen.
# Personal settings, such as DECISIONKIT_PROVIDER, go in the ignored
# mise.local.toml under [env].

[tools]
jq = "1.8.2"
yq = "4.54.1"
bats = "1.14.0"
# The GitHub CLI. The label and issue scripts call it.
gh = "2.103.3"
pre-commit = "4.6.2"
vale = "3.25.1"
# decisionkit runs on node. The skill thresholds are calibrated on 0.4.0.
node = "26.12.1"
"npm:@adxtya21/decisionkit" = { version = "0.4.0", allow_low_downloads = true }

[tasks.setup]
description = "Install the tools, the Vale styles and the pre-commit hooks"
run = ["mise install", "vale sync", "pre-commit install --install-hooks"]

[tasks."agents:link"]
description = "Create or repair agent symlinks and generated MCP configs"
run = "scripts/agents-link.sh"

[tasks."agents:check"]
description = "Fail if agent symlinks or generated MCP configs drift"
run = "scripts/agents-link.sh --check"

[tasks."agents:health"]
description = "Check the agent environment of this machine (decisionkit, hooks)"
run = "scripts/agents-health.sh"

[tasks."knowledge:size"]
description = "Fail if an AGENTS.md exceeds its line limit"
run = "scripts/check-agents-md-size.sh"

[tasks."knowledge:lint"]
description = "Lint the structure of the skills and the Markdown links"
run = "scripts/lint-knowledge.sh"

[tasks."skills:drift"]
description = "Run the drift tests of every skill (no LLM)"
run = "scripts/skill-drift.sh"

[tasks."skills:test"]
description = "Run every test layer of one skill, or of all skills (calls an LLM)"
usage = 'arg "[skill]" help="Skill folder name. Omit to test every skill."'
run = '''
#!/usr/bin/env bash
set -u
status=0
for dir in .agents/skills/${usage_skill:-*}/; do
	make -k -C "$dir" test || status=1
done
exit $status
'''

[tasks."scripts:test"]
description = "Run the bats suites of scripts/*.sh, or only the suites that the given files affect"
run = "scripts/script-tests.sh run"

[tasks."scripts:coverage"]
description = "Fail if a shell script has no bats suite"
run = "scripts/script-tests.sh coverage"

[tasks."research:check"]
description = "Check every research in docs/research (tech-research skill)"
run = ".agents/skills/tech-research/scripts/research.sh check"

[tasks."taxonomy:check"]
description = "Fail if the issue forms and .github/labels.yml differ"
run = "scripts/taxonomy-check.sh"

[tasks."labels:sync"]
description = "Make the GitHub labels equal .github/labels.yml (--dry-run to preview)"
run = "scripts/labels-sync.sh"

[tasks."issue:new"]
description = "Open an issue from an issue form. Fields as YAML on stdin"
usage = '''
arg "<type>" help="Form name in .github/ISSUE_TEMPLATE, such as bug or chore"
flag "--dry-run" help="Print the issue and open nothing"
'''
run = '''
#!/usr/bin/env bash
if [[ ${usage_dry_run:-false} == true ]]; then
	exec scripts/issue-new.sh "$usage_type" --dry-run
fi
exec scripts/issue-new.sh "$usage_type"
'''

[tasks."pr:check"]
description = "Check one pull request against the pr-shepherd rules (needs gh and the network)"
run = ".agents/skills/pr-shepherd/scripts/shepherd.sh check"

[tasks."pr:shepherd"]
description = "Run a pr-shepherd command, such as verify <pr> or merge <pr>"
run = ".agents/skills/pr-shepherd/scripts/shepherd.sh"

[tasks."prose:lint"]
description = "Lint the Markdown prose with Vale"
run = "git ls-files -z '*.md' | xargs -0 vale"

# The repo layer only. mise tasks never call pnpm: pnpm owns the build,
# the tests and the packages of the code layer.
[tasks.check]
description = "Run the structural checks of the repository, as CI does (fast, no bats suites)"
depends = ["agents:check", "knowledge:size", "knowledge:lint", "scripts:coverage", "research:check", "taxonomy:check", "prose:lint"]

[tasks.test]
description = "Run the bats suites that the changed files affect (--all runs every suite)"
run = "scripts/ci-plan.sh test"
