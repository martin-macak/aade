# Vale lints the prose of the agent layer and the human docs.
# Pre-commit runs it (see .pre-commit-config.yaml). Run `vale sync` once to
# download the ai-tells package into .vale/styles.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells, House

# Package rules that are turned off. Each one has a House copy that keeps the
# real detection. Never turn a rule off to let a finding pass. Reword the
# text instead.
#
# FormalTransitions flags "for example", a plain connector. House.Transitions
# holds the same token list without "For example".
ai-tells.FormalTransitions = NO
# FigurativeKeeps flags the imperative "Keep hooks fast", the usual form of a
# maintenance rule. House.FigurativeKeeps matches only "keeps", "kept" and
# "keeping", so "The cache keeps a re-run cheap" still fails.
ai-tells.FigurativeKeeps = NO
