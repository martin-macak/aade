extends: existence
# Copy of ai-tells.FigurativeKeeps (package v1.37.0) that matches only the
# third-person forms "keeps", "kept" and "keeping". The imperative "Keep
# hooks fast" is plain technical prose, so it passes. .vale.ini turns the
# package rule off. Refresh this copy when the package changes.
message: "AI upkeep frame: '%s'. Say what the mechanism does to the thing, not what state it keeps it in."
level: error
nonword: true
ignorecase: true
tokens:
  - "\\bke(?:eps|eping|pt) (?:(?:a|an|the|this|that|these|those|its|their|each|every|our|your|my|all|both|any|some) )?(?:[a-z'-]+ ){1,3}(?:cheap|green|lean|legible|pristine|deterministic|settled|immutable|sharp|fresh|sane|happy|whole|small|fast|short|thin|light|tight|current|safe|stable|simple|flat|portable|readable|reproducible|idempotent|hermetic|reversible|auditable|explainable|boring)\\b"

  - "\\bke(?:eps|eping|pt) (?:a|an|the|this|that|these|those|its|their|each|every|our|your|my|all|both|any|some) (?:[a-z'-]+ ){1,3}(?:clear of|away from|off the)\\b"

  - "\\bke(?:eps|eping|pt) (?:a|an|the|this|that|these|those|its|their|each|every|our|your|my|all|both|any|some) (?:[a-z'-]+ ){1,3}from (?:mistaking|reading|thinking|believing|seeing|treating|assuming|guessing|deciding|confusing|misreading|learning|knowing|noticing)\\b"
