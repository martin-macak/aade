# Keeps the commit SHAs of the pinned GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    # Labels from .github/labels.yml. Without them, Dependabot adds its own
    # labels, and the next labels-sync deletes them.
    # `mise run taxonomy:check` fails when a label is not in labels.yml.
    labels: [type:ci, scope:github]
