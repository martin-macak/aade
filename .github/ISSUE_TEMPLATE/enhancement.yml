# Issue form for an enhancement: new or changed behaviour. The
# issue-authoring skill tells agents how to write the same body with
# scripts/issue-new.sh.
name: Enhancement
description: New or changed behaviour.
labels: [type:enhancement]
body:
  # The options must equal the scope:* labels in .github/labels.yml.
  # `mise run taxonomy:check` fails when they differ.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: The area this issue changes. It becomes the scope:<x> label.
      options:
        - agents
        - github
        - docs
        - repository
        - tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and why? Describe the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. The issue is done when all hold.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions you considered, and why you rejected them.
  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking change
      options:
        - label: This change breaks existing behaviour, config or interfaces.
