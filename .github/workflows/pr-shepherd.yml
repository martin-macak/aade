# Enforces the pr-shepherd rules on each pull request. The pr-shepherd
# skill explains them. The check is deterministic: no LLM runs in CI. It
# reads the trace that `shepherd.sh verify` writes as a commit status.
# A resolved thread and a new status fire no workflow event, so verify
# re-runs this workflow itself. On a push, the carry job first copies a
# fresh trace from the previous head to the new head.
name: pr-shepherd

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
  # An edited issue makes the trace of each PR that closes it stale.
  issues:
    types: [edited]

permissions:
  contents: read

# The newest event of a PR or an issue wins.
concurrency:
  group: pr-shepherd-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # On each push to a PR, run shepherd.sh carry. It copies a success trace
  # of the previous head to the new head. Both hashes must still match the
  # Requirements section and the issue, and the new head must have no
  # trace yet.
  # The job may write statuses. It checks out the base commit and runs its
  # script, not the code of the PR. A fork PR gets a read-only token. The
  # job skips such a PR.
  carry:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: gh jq yq
      - run: mise run pr:shepherd carry "$PR" "$BEFORE" "$AFTER"
        env:
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The rulesets require this job by its name, pr-shepherd. It runs the
  # check after carry ends. A failed or skipped carry does not stop it.
  pr-shepherd:
    needs: carry
    if: ${{ !cancelled() && github.event_name != 'issues' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: gh jq yq
      # The script reads the body through gh. The body is untrusted input,
      # so it never goes into an expression of this file.
      - run: mise run pr:check "$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Turn off auto-merge on the open PRs that close the edited issue, so
  # none merges with a stale trace.
  disarm:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: gh jq yq
      - run: mise run pr:shepherd disarm "$ISSUE"
        env:
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
