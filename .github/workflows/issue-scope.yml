# Sets the scope:<x> label of an issue from the Scope field of its form.
# Issue forms can set only fixed labels, so the form sets type:<x> and this
# workflow sets scope:<x>. It runs again when someone edits the body.
name: issue-scope

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

# The latest edit of an issue wins.
concurrency:
  group: issue-scope-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: gh jq yq
      # The script reads the body through gh. The body is untrusted input,
      # so it never goes into an expression of this file.
      - run: scripts/issue-scope-label.sh "$ISSUE"
        env:
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
