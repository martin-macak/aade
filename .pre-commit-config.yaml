# Pre-commit is the quality gate. Each hook calls a mise task or a script
# through `mise exec`, so it uses the tool versions pinned in mise.toml.
# CI runs the same checks with `mise run check` and `mise run test`.
# Install the hooks with `mise run setup`.
repos:
  - repo: local
    hooks:
      - id: agents-check
        name: agent symlinks and generated MCP configs
        entry: mise run agents:check
        language: system
        pass_filenames: false
        always_run: true
      - id: agents-md-size
        name: AGENTS.md size limit
        entry: mise exec -- scripts/check-agents-md-size.sh
        language: system
        files: (^|/)AGENTS\.md$
      - id: knowledge-lint
        name: knowledge layer lint
        entry: mise exec -- scripts/lint-knowledge.sh
        language: system
        pass_filenames: false
        files: \.md$|^\.agents/skills/
        # Links such as CLAUDE.md are symlinks. The default types: [file]
        # would drop them.
        types: []
        types_or: [file, symlink]
      - id: test
        name: affected bats suites
        entry: mise exec -- scripts/ci-plan.sh test
        language: system
        # Every staged file goes to ci-plan.sh. It picks the suites from
        # scripts/<x>.sh and the tests/*.watch files of the skills, so this
        # hook needs no files filter.
        types: []
        types_or: [file, symlink]
        # One call gets all files, so no suite runs twice.
        require_serial: true
      - id: scripts-coverage
        name: every shell script has a bats suite
        entry: mise run scripts:coverage
        language: system
        pass_filenames: false
        files: ^(scripts/|tests/scripts/|\.agents/skills/[^/]+/(scripts|tests)/)
      - id: taxonomy-check
        name: issue forms match .github/labels.yml
        entry: mise run taxonomy:check
        language: system
        pass_filenames: false
        files: ^(\.github/ISSUE_TEMPLATE/|\.github/dependabot\.yml$|\.github/labels\.yml$|scripts/taxonomy-check\.sh$)
      - id: markers-check
        name: no task markers in tracked files
        entry: mise exec -- scripts/markers-check.sh
        language: system
        # Work notes go in the pull request, not in a file. Pre-commit passes
        # the staged text files. CI checks every tracked file.
        types: [text]
      - id: research-check
        name: research format (tech-research skill)
        entry: mise run research:check
        language: system
        pass_filenames: false
        files: ^docs/research/
      - id: vale
        name: vale (prose lint)
        entry: mise exec -- vale
        language: system
        types: [markdown]
